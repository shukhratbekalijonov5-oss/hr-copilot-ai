plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ai.hrcopilot'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

/*
 * Patched embedded Tomcat.
 *
 * Spring Boot 3.5.5 manages tomcat-embed-core 10.1.44, which carries three
 * CRITICAL CVEs (CVE-2026-41293, -43512, -43515) fixed in 10.1.55. Overriding
 * the managed property keeps us on Boot 3.5.5 — a patch-level bump inside the
 * same 10.1.x line, which is API-compatible — rather than moving the whole
 * framework to chase one transitive dependency.
 *
 * Remove this when the Boot version we track manages 10.1.55 or later.
 */
ext['tomcat.version'] = '10.1.55'

repositories {
    mavenCentral()
}

/*
 * The local Docker daemon (29.x, API 1.55) rejects the API version the
 * docker-java bundled with Testcontainers 1.21.3 speaks. Force the newest
 * docker-java, which negotiates correctly against modern daemons.
 */
configurations.configureEach {
    resolutionStrategy {
        force 'com.github.docker-java:docker-java-api:3.5.1'
        force 'com.github.docker-java:docker-java-core:3.5.1'
        force 'com.github.docker-java:docker-java-transport:3.5.1'
        force 'com.github.docker-java:docker-java-transport-zerodep:3.5.1'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Testcontainers + a Spring context per test class: give the forked JVM room.
    maxHeapSize = '1g'
}

