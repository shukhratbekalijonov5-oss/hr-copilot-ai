# Optional local backing services for the Payment Service ONLY.
#
# The shared HR Copilot dev stack (infra/docker-compose.yml) already runs
# PostgreSQL; the payment service uses a SEPARATE DATABASE on that same
# instance by default (hr_copilot_payments), so this file is only needed for
# a local Kafka broker:
#
#   docker compose -f payment-service/docker-compose.dev.yml up -d
#   PAYMENT_OUTBOX_PUBLISH_ENABLED=true ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# Listener topology (KRaft, Apache Kafka 3.9):
#   HOST      → advertised as localhost:9092  (host NestJS + host Java)
#   DOCKER    → advertised as kafka:29092     (containers on this network)
#   CONTROLLER→ internal quorum only
# A host client bootstraps via localhost:9092 and is advertised the same
# address back; a containerized client (e.g. the Dockerized payment
# service) joins this compose network and bootstraps kafka:29092. Neither
# side ever sees the other's unreachable address.
# Names are prefixed hrcopilot-payment- to avoid colliding with other stacks.
name: hrcopilot-payment

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: hrcopilot-payment-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
