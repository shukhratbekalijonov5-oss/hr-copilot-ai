[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers -m "not live"
markers =
    integration: requires a live Qdrant instance (skipped when unavailable)
    slow: downloads/loads real transformer models
    live: calls a real LLM provider; costs money and is non-deterministic.
        Excluded from the default run — enable with `-m live`.
asyncio_default_fixture_loop_scope = function
