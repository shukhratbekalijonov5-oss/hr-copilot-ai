{{- if .Values.networkPolicy.enabled }}
# Data services accept traffic ONLY from pods carrying the matching client
# label. Phase-4 app pods MUST declare the labels below (documented in
# values + RESTORE.md). Policies select only data pods, so nothing here can
# lock out future app pods themselves. Egress is deliberately unrestricted
# at this phase.
#
#   backend:              postgres-client, redis-client, kafka-client, qdrant-client
#   payment-service:      postgres-client, kafka-client
#   notification-service: postgres-client, kafka-client
#   ai-service:           qdrant-client
#   backup jobs:          postgres-client (set below on the CronJob pod labels? they carry app=postgres-backup, allowed explicitly)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-access
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { hrcopilot.dev/postgres-client: "true" } }
        - podSelector: { matchLabels: { app: postgres-backup } }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-access
spec:
  podSelector: { matchLabels: { app: redis } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { hrcopilot.dev/redis-client: "true" } }
      ports: [{ protocol: TCP, port: 6379 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-access
spec:
  podSelector: { matchLabels: { app: kafka } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { hrcopilot.dev/kafka-client: "true" } }
      ports: [{ protocol: TCP, port: 9092 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-access
spec:
  podSelector: { matchLabels: { app: qdrant } }
  policyTypes: ["Ingress"]
  ingress:
    # Prometheus scrapes Qdrant's own /metrics from the monitoring namespace.
    # Read-only, and the only cross-namespace exception in this file: every
    # other data service is reached through an exporter that runs in THIS
    # namespace and therefore already satisfies the client-label rule.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ protocol: TCP, port: 6333 }]
    - from:
        - podSelector: { matchLabels: { hrcopilot.dev/qdrant-client: "true" } }
      ports:
        - { protocol: TCP, port: 6333 }
        - { protocol: TCP, port: 6334 }
{{- end }}
