{{- if .Values.backup.enabled }}
# PVC-SAFETY: this standalone PVC is Helm-owned, so it carries the keep
# policy — `helm uninstall` will NOT delete it. NOTE the storage class
# (local-path) has ReclaimPolicy Delete: deleting a PVC deletes its data.
# PVC deletion must always be a separate, deliberate human act.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  labels: { app: postgres-backup }
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.backup.storage }} } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-script
  labels: { app: postgres-backup }
data:
  backup.sh: |
    #!/bin/sh
    # Timestamped, compressed dumps of all three databases. Any failure
    # exits non-zero so the Job (and its metrics) show it honestly.
    # NOTE: no pipes around pg_dump — a piped pg_dump failure would be
    # masked by gzip's exit code. Dump to file first, then compress.
    set -eu
    # The k3s network-policy controller takes ~10-20s to admit a NEWLY
    # created pod into the postgres allow-list; wait instead of failing.
    tries=0
    until pg_isready -h postgres -U postgres -q; do
      tries=$((tries+1))
      [ "$tries" -ge 18 ] && echo "postgres unreachable after 90s" && exit 1
      sleep 5
    done
    ts=$(date -u +%Y%m%dT%H%M%SZ)
    for db in hr_copilot hr_copilot_payments hr_copilot_notifications; do
      echo "dumping $db"
      pg_dump -h postgres -U postgres -d "$db" -f "/backups/$db-$ts.sql.part"
      gzip "/backups/$db-$ts.sql.part"
      mv "/backups/$db-$ts.sql.part.gz" "/backups/$db-$ts.sql.gz"
    done
    echo "pruning older than {{ .Values.backup.retentionDays }} days"
    find /backups -name '*.sql.gz' -mtime +{{ .Values.backup.retentionDays }} -delete
    find /backups -name '*.part' -mmin +60 -delete
    {{- if .Values.backup.r2.enabled }}
    echo "syncing to R2"
    rclone --config /r2/rclone.conf copy /backups {{ .Values.backup.r2.remote | quote }} --include '*.sql.gz'
    {{- else }}
    echo "R2 offsite sync DISABLED (no production credentials yet) — local PVC only"
    {{- end }}
    echo "backup complete:"; ls -lh /backups | tail -4
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels: { app: postgres-backup }
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: { app: postgres-backup }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              command: ["/bin/sh", "/scripts/backup.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: postgres-credentials, key: postgres-password } }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: script, mountPath: /scripts, readOnly: true }
                {{- if .Values.backup.r2.enabled }}
                - { name: r2, mountPath: /r2, readOnly: true }
                {{- end }}
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: postgres-backups }
            - name: script
              configMap: { name: postgres-backup-script, defaultMode: 0555 }
            {{- if .Values.backup.r2.enabled }}
            - name: r2
              secret: { secretName: backup-r2 }
            {{- end }}
{{- end }}
