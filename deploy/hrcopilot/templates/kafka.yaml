{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app: kafka }
spec:
  type: ClusterIP
  selector: { app: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: 9092 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: { app: kafka }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000        # appuser in apache/kafka image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            # Single-node KRaft, combined broker+controller, no ZooKeeper.
            # The advertised listener is the STABLE broker string every
            # service uses: kafka.hrcopilot.svc.cluster.local:9092
            - { name: CLUSTER_ID, value: {{ .Values.kafka.clusterId | quote }} }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.{{ .Release.Namespace }}.svc.cluster.local:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_HEAP_OPTS, value: {{ .Values.kafka.heapOpts | quote }} }
          ports:
            - { containerPort: 9092 }
            - { containerPort: 9093 }
          startupProbe:
            tcpSocket: { port: 9092 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 20
          resources: {{ .Values.kafka.resources | toYaml | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.kafka.storage }} } }
{{- end }}
