{{- if .Values.extras.enabled }}
# Backend local-driver object storage (interim until R2 credentials exist).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-storage
  annotations: { helm.sh/resource-policy: keep }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.extras.backendStorageSize }} } }
---
# Mailpit: INTERIM in-cluster SMTP sink until production SMTP credentials
# exist. Emails are visible on :8025 (cluster-internal only) and reach no
# real mailbox — flagged as a deployment blocker, not hidden.
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels: { app: mailpit }
spec:
  type: ClusterIP
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: http, port: 8025, targetPort: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: { app: mailpit }
spec:
  replicas: 1
  selector: { matchLabels: { app: mailpit } }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.24
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports: [{ containerPort: 1025 }, { containerPort: 8025 }]
          readinessProbe:
            httpGet: { path: /livez, port: 8025 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
{{- end }}
