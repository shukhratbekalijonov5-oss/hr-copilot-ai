{{- if .Values.qdrantBackup.enabled }}
# Full-instance Qdrant snapshot via its own snapshot API; snapshots land in
# the qdrant PVC (/qdrant/snapshots) and ride the same offsite story as
# postgres once R2 exists. Disabled until production collections exist.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qdrant-snapshot
  labels: { app: qdrant-backup }
spec:
  schedule: {{ .Values.qdrantBackup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: { app: qdrant-backup }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: snapshot
              image: curlimages/curl:8.10.1
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              command: ["sh", "-c", "curl -sf -X POST http://qdrant:6333/snapshots && echo snapshot-created"]
              resources:
                requests: { cpu: 50m, memory: 32Mi }
                limits: { cpu: 200m, memory: 64Mi }
{{- end }}
