# ACME issuers (HTTP-01 via Traefik). Staging validates the plumbing once
# before production issuance — Let's Encrypt production has strict failure
# rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@hrcopilot.cloud
    privateKeySecretRef: { name: acme-staging-account }
    solvers:
      - http01: { ingress: { ingressClassName: traefik } }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@hrcopilot.cloud
    privateKeySecretRef: { name: acme-prod-account }
    solvers:
      - http01: { ingress: { ingressClassName: traefik } }
